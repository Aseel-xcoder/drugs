<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدليل اليمني الشامل للأدوية</title>
<meta name="description" content="ابحث عن أي دواء بالاسم التجاري أو العلمي، بالعربية أو الإنجليزية — يعمل في أي متصفح بدون تثبيت.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- الترويسة (200px، تدرج #055D72→#078B99→#1BAEBA) — مطابقة للتطبيق -->
  <header class="hero" id="heroBox">
    <div class="hero-ring" aria-hidden="true"></div>
    <div class="hero-fill" aria-hidden="true"></div>
    <a class="hero-reason" id="heroReason" href="https://t.me/Med_tips_and_tricks" target="_blank" rel="noopener">Dr. Reason</a>
    <div class="hero-content">
      <div class="hero-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 3.8a6.3 6.3 0 0 1 9 8.9l-6.2 6.2a6.3 6.3 0 1 1-8.9-8.9z"/><path d="M8.5 9.1l6.5 6.5"/></svg>
      </div>
      <div class="hero-title">الدليل اليمني الشامل للأدوية</div>
      <div class="hero-eyebrow">مرجعك الدوائي</div>
    </div>
  </header>

  <!-- المحتوى (بطاقة البحث تتداخل 42px فوق الترويسة، كما في التطبيق) -->
  <div class="content-box" id="contentBox">
    <section class="search-card" aria-label="بحث">
      <div class="search-head">
        <div class="search-titles">
          <div class="search-title">ابحث عن دواء</div>
          <div class="search-eyebrow">بحث سريع ودقيق</div>
        </div>
        <button class="home-from-search" id="homeFromSearch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
          الرئيسية
        </button>
        <div class="search-heading-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#078C9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 3.8a6.3 6.3 0 0 1 9 8.9l-6.2 6.2a6.3 6.3 0 1 1-8.9-8.9z"/><path d="M8.5 9.1l6.5 6.5"/></svg>
        </div>
      </div>
      <div class="search-row">
        <input id="searchBox" type="search" placeholder="اكتب اسم الدواء…" autocomplete="off" aria-label="ابحث عن دواء">
        <button id="searchTrigger" type="button" aria-label="بحث">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 10.8a6.7 6.7 0 1 0-13.4 0 6.7 6.7 0 1 0 13.4 0"/><path d="M16 16l5 5"/></svg>
        </button>
      </div>
    </section>

    <main id="view" aria-live="polite">
      <div class="loading"><div class="spin"></div>جاري تجهيز الداتا…</div>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
